[package]
name = "cmake-rust"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[[bin]]
name = "cmake"
path = "src/main.rs"

[dependencies]
flate2 = "1"
libc = "0.2"
md-5 = "0.10.6"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11.0"
sha2 = "0.11.0"
sha3 = "0.12.0"
shlex = "1"
tar = "0.4"
